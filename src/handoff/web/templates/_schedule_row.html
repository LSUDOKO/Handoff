{% import "_page.html" as ui %}
<tr id="sched-{{ s.schedule_id }}">
  <td><b class="text-bright">{{ s.workflow_name }}</b></td>
  <td>{{ s.readable }}</td>
  <td class="mono">{{ s.cron }}</td>
  <td class="text-faded">{{ s.timezone }}</td>
  <td class="text-faded">{{ s.next_in }}</td>
  <td class="num">{{ s.run_count or 0 }}</td>
  <td>{{ ui.status('active-ws' if s.enabled else 'paused', 'enabled' if s.enabled else 'paused') }}</td>
  <td><span class="row" style="justify-content:flex-end">
    <button class="button secondary small" hx-post="/schedules/{{ s.schedule_id }}/toggle" hx-target="#sched-{{ s.schedule_id }}" hx-swap="outerHTML">{{ 'Pause' if s.enabled else 'Enable' }}</button>
    <button class="button primary small" hx-post="/schedules/{{ s.schedule_id }}/run" hx-target="#sched-{{ s.schedule_id }}" hx-swap="outerHTML">{{ ui.icon('i-play','sm') }} Run now</button>
  </span></td>
</tr>
