<div class="turn you">
  <p class="speaker">You</p>
  <div class="body">{{ user_message }}</div>
</div>
<div class="turn">
  <p class="speaker">Handoff</p>
  <div class="body">{{ reply }}</div>
  {% if config_json %}
  <pre>{{ config_json }}</pre>
  <p style="margin-top:1rem">
    <button hx-post="/chat/save"
            hx-vals='{"config": {{ config_json_attr }} }'
            hx-target="#thread"
            hx-swap="beforeend">Save this workflow</button>
  </p>
  {% endif %}
</div>
