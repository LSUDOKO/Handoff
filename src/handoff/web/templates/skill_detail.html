{% extends "base.html" %}
{% import "_page.html" as ui %}
{% block title %}{{ skill.name }} — Handoff{% endblock %}
{% block body %}
<div class="page">
  {{ ui.title(skill.name, skill.description, [{"label": "Skills", "href": "/skills"}]) }}
  <div class="page-body narrow">
    <form class="stack" hx-post="/skills/save" hx-target="body" hx-swap="outerHTML">
      <input type="hidden" name="skill_id" value="{{ skill.skill_id }}">
      <label class="field"><span>Skill document</span><textarea class="code" name="markdown">{{ markdown }}</textarea></label>
      <div class="form-actions"><button class="button accent" type="submit">Save changes</button><a class="button secondary" href="/skills">Back</a></div>
    </form>
  </div>
</div>
{% endblock %}
