[project]
name = "handoff"
version = "0.1.0"
description = "Describe it. Hand it off. It runs. — autonomous workflows with a human decision gate, built on the Strands Agents SDK."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Handoff" }]
keywords = ["strands", "agents", "bedrock", "agentcore", "human-in-the-loop", "workflow"]

dependencies = [
    "strands-agents>=1.55.0",
    "strands-agents-tools>=0.8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "json-repair>=0.30.0",
    "rich>=13.0.0",
    "markdown>=3.6",
]

[project.urls]
Homepage = "https://github.com/LSUDOKO/Handoff"
Repository = "https://github.com/LSUDOKO/Handoff"
Issues = "https://github.com/LSUDOKO/Handoff/issues"

[project.optional-dependencies]
# Reasoning providers — pick one; the agent code is identical across them.
groq = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.40.0"]
bedrock = ["boto3>=1.35.0", "amazon-transcribe>=0.6.0"]
# Serverless deployment on Bedrock AgentCore.
agentcore = ["bedrock-agentcore>=0.1.0"]
# Native desktop window.
desktop = ["pywebview>=5.0"]
# Microphone from the terminal and the desktop window (needs PortAudio).
voice = ["sounddevice>=0.5"]
# A credential-free MCP server, so a fresh clone can read a real web page.
web = ["mcp-server-fetch>=0.1.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
handoff = "handoff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The web UI (templates, CSS, JS) and the shipped workflow templates live
# inside the package directory, so hatchling ships them automatically — which
# is what makes `pip install handoff && handoff serve` work with no checkout.
[tool.hatch.build.targets.wheel]
packages = ["src/handoff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
