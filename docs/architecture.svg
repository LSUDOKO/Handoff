<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" width="1120" height="790" font-family="Archivo, Helvetica Neue, Arial, sans-serif">
  <title>Handoff architecture</title>
  <desc>You describe a chore to the Builder agent, which writes a workflow config. The Executor runs it as a Strands Graph; its human-in-the-loop gate defers items it cannot judge confidently, then raises a single interrupt for all of them once the pass is done. The Learner turns each decision into a rule, so later runs ask less.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6e6b"/>
    </marker>
    <marker id="arrow-stamp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4231f"/>
    </marker>
    <marker id="arrow-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5d50"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#171c1d"/>
    </marker>
  </defs>

  <rect width="1120" height="790" fill="#f2f4f3"/>

  <text x="48" y="52" font-size="26" font-weight="700" fill="#171c1d" letter-spacing="-0.5">Handoff</text>
  <text x="146" y="52" font-size="15" fill="#5f6e6b">— autonomous workflows with a human decision gate</text>
  <line x1="48" y1="68" x2="1072" y2="68" stroke="#171c1d" stroke-width="2"/>

  <!-- ============ BAND 1: You ============ -->
  <text x="48" y="100" font-size="12" font-weight="600" fill="#5f6e6b">YOU</text>
  <line x1="48" y1="110" x2="1072" y2="110" stroke="#cbd3d1" stroke-width="1"/>

  <rect x="48" y="126" width="290" height="70" rx="3" fill="#fbfcfb" stroke="#9aa8a4"/>
  <text x="66" y="152" font-size="15" font-weight="600" fill="#171c1d">Builder chat</text>
  <text x="66" y="173" font-size="13" fill="#5f6e6b">&#8220;every weekday at 8am, triage my inbox&#8230;&#8221;</text>
  <text x="66" y="189" font-size="12" fill="#5f6e6b">typed, or spoken</text>

  <rect x="700" y="126" width="372" height="70" rx="3" fill="#f8eae9" stroke="#b4231f" stroke-width="2"/>
  <text x="718" y="152" font-size="15" font-weight="600" fill="#b4231f">Decision screen</text>
  <text x="718" y="173" font-size="13" fill="#5f6e6b">one screen for everything it set aside</text>
  <text x="718" y="189" font-size="12" fill="#5f6e6b">click, or say &#8220;archive it&#8221;</text>

  <!-- ============ BAND 2: Agents ============ -->
  <text x="48" y="242" font-size="12" font-weight="600" fill="#5f6e6b">AGENTS &#8212; STRANDS AGENTS SDK</text>
  <line x1="48" y1="252" x2="1072" y2="252" stroke="#cbd3d1" stroke-width="1"/>

  <rect x="48" y="268" width="190" height="96" rx="3" fill="#fbfcfb" stroke="#9aa8a4"/>
  <text x="66" y="294" font-size="14" font-weight="600" fill="#171c1d">Builder</text>
  <text x="66" y="315" font-size="12" fill="#5f6e6b">conversational</text>
  <text x="66" y="334" font-size="12" fill="#5f6e6b">sentence &#8594; workflow</text>
  <text x="66" y="350" font-size="12" fill="#5f6e6b">config (JSON)</text>

  <rect x="270" y="268" width="530" height="172" rx="3" fill="#fbfcfb" stroke="#171c1d" stroke-width="2"/>
  <text x="288" y="292" font-size="14" font-weight="600" fill="#171c1d">Executor &#8212; Strands Graph</text>
  <text x="288" y="311" font-size="12" fill="#5f6e6b">deterministic and replayable &#8212; not a Swarm</text>

  <rect x="288" y="330" width="114" height="88" rx="3" fill="#f2f4f3" stroke="#9aa8a4"/>
  <text x="345" y="360" font-size="13" font-weight="600" fill="#171c1d" text-anchor="middle">trigger</text>
  <text x="345" y="380" font-size="11" fill="#5f6e6b" text-anchor="middle">cron / webhook</text>
  <text x="345" y="398" font-size="11" fill="#5f6e6b" text-anchor="middle">didn&#8217;t fire? stop</text>

  <rect x="418" y="330" width="220" height="88" rx="3" fill="#f8eae9" stroke="#b4231f" stroke-width="2"/>
  <text x="528" y="354" font-size="13" font-weight="600" fill="#171c1d" text-anchor="middle">executor</text>
  <text x="528" y="373" font-size="11" font-weight="600" fill="#b4231f" text-anchor="middle">BeforeToolCallEvent gate</text>
  <text x="528" y="391" font-size="11" fill="#5f6e6b" text-anchor="middle">confident &#8594; act silently</text>
  <text x="528" y="408" font-size="11" fill="#5f6e6b" text-anchor="middle">unsure &#8594; defer, keep going</text>

  <rect x="654" y="330" width="128" height="88" rx="3" fill="#f2f4f3" stroke="#9aa8a4"/>
  <text x="718" y="360" font-size="13" font-weight="600" fill="#171c1d" text-anchor="middle">completer</text>
  <text x="718" y="380" font-size="11" fill="#5f6e6b" text-anchor="middle">audit + notify</text>
  <text x="718" y="398" font-size="11" fill="#5f6e6b" text-anchor="middle">summary</text>

  <line x1="402" y1="374" x2="416" y2="374" stroke="#171c1d" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <line x1="638" y1="374" x2="652" y2="374" stroke="#171c1d" stroke-width="1.5" marker-end="url(#arrow-ink)"/>

  <rect x="832" y="268" width="240" height="96" rx="3" fill="#fbfcfb" stroke="#2f5d50" stroke-width="2"/>
  <text x="850" y="294" font-size="14" font-weight="600" fill="#2f5d50">Learner</text>
  <text x="850" y="315" font-size="12" fill="#5f6e6b">one decision &#8594; one narrow rule</text>
  <text x="850" y="334" font-size="12" fill="#5f6e6b">exact sender, or a domain, or</text>
  <text x="850" y="350" font-size="12" fill="#5f6e6b">two distinct keywords &#8212; never vaguer</text>

  <!-- ============ BAND 3: Tools ============ -->
  <text x="48" y="486" font-size="12" font-weight="600" fill="#5f6e6b">TOOLS &#8212; MCP</text>
  <line x1="48" y1="496" x2="1072" y2="496" stroke="#cbd3d1" stroke-width="1"/>

  <rect x="48" y="512" width="238" height="62" rx="3" fill="#fbfcfb" stroke="#9aa8a4"/>
  <text x="66" y="536" font-size="13" font-weight="600" fill="#171c1d">Gmail &#183; Linear</text>
  <text x="66" y="557" font-size="12" fill="#5f6e6b">read, archive, draft, file tickets</text>

  <rect x="302" y="512" width="238" height="62" rx="3" fill="#fbfcfb" stroke="#9aa8a4"/>
  <text x="320" y="536" font-size="13" font-weight="600" fill="#171c1d">Slack &#183; GitHub</text>
  <text x="320" y="557" font-size="12" fill="#5f6e6b">notify, review pull requests</text>

  <rect x="556" y="512" width="238" height="62" rx="3" fill="#fbfcfb" stroke="#9aa8a4"/>
  <text x="574" y="536" font-size="13" font-weight="600" fill="#171c1d">web fetch</text>
  <text x="574" y="557" font-size="12" fill="#5f6e6b">no credentials &#8212; runs on a clone</text>

  <rect x="810" y="512" width="262" height="62" rx="3" fill="#fbfcfb" stroke="#2f5d50"/>
  <text x="828" y="536" font-size="13" font-weight="600" fill="#2f5d50">Memory</text>
  <text x="828" y="557" font-size="12" fill="#5f6e6b">learned rules (AgentCore or local)</text>

  <!-- ============ BAND 4: runtime ============ -->
  <text x="48" y="622" font-size="12" font-weight="600" fill="#5f6e6b">RUNS ON</text>
  <line x1="48" y1="632" x2="1072" y2="632" stroke="#cbd3d1" stroke-width="1"/>

  <rect x="48" y="648" width="240" height="62" rx="3" fill="#fbfcfb" stroke="#9aa8a4"/>
  <text x="168" y="672" font-size="13" font-weight="600" fill="#171c1d" text-anchor="middle">Model provider</text>
  <text x="168" y="692" font-size="11" fill="#5f6e6b" text-anchor="middle">Bedrock &#183; Anthropic &#183; Groq</text>

  <rect x="304" y="648" width="240" height="62" rx="3" fill="#fbfcfb" stroke="#9aa8a4"/>
  <text x="424" y="672" font-size="13" font-weight="600" fill="#171c1d" text-anchor="middle">AgentCore Runtime</text>
  <text x="424" y="692" font-size="11" fill="#5f6e6b" text-anchor="middle">serverless, background, 8h</text>

  <rect x="560" y="648" width="240" height="62" rx="3" fill="#fbfcfb" stroke="#9aa8a4"/>
  <text x="680" y="672" font-size="13" font-weight="600" fill="#171c1d" text-anchor="middle">DynamoDB &#183; EventBridge</text>
  <text x="680" y="692" font-size="11" fill="#5f6e6b" text-anchor="middle">audit trail &#183; cron triggers</text>

  <rect x="816" y="648" width="256" height="62" rx="3" fill="#fbfcfb" stroke="#9aa8a4"/>
  <text x="944" y="672" font-size="13" font-weight="600" fill="#171c1d" text-anchor="middle">Local &#183; desktop window</text>
  <text x="944" y="692" font-size="11" fill="#5f6e6b" text-anchor="middle">JSON state, no cloud required</text>

  <!-- ============ connections ============ -->
  <line x1="150" y1="196" x2="150" y2="266" stroke="#5f6e6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="238" y1="314" x2="268" y2="314" stroke="#5f6e6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="253" y="306" font-size="10" fill="#5f6e6b" text-anchor="middle">config</text>

  <!-- gate -> decision screen (the batch interrupt) -->
  <path d="M 628 330 L 628 236 L 886 236 L 886 198" fill="none" stroke="#b4231f" stroke-width="2" marker-end="url(#arrow-stamp)"/>
  <text x="700" y="228" font-size="11" font-weight="600" fill="#b4231f" text-anchor="middle">one event.interrupt() for the whole batch</text>

  <!-- decision -> gate (resume) -->
  <path d="M 762 198 L 762 216 L 498 216 L 498 328" fill="none" stroke="#b4231f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-stamp)"/>
  <text x="630" y="210" font-size="11" fill="#b4231f" text-anchor="middle">resume &#8212; same run, nothing acted on yet</text>

  <!-- decision -> learner -->
  <path d="M 1000 198 L 1000 266" fill="none" stroke="#2f5d50" stroke-width="1.5" marker-end="url(#arrow-agent)"/>
  <text x="1012" y="234" font-size="10" fill="#2f5d50">learns</text>

  <!-- learner -> memory -->
  <path d="M 952 364 L 952 510" fill="none" stroke="#2f5d50" stroke-width="1.5" marker-end="url(#arrow-agent)"/>
  <!-- memory -> executor (recall) -->
  <path d="M 900 512 L 900 462 L 470 462 L 470 420" fill="none" stroke="#2f5d50" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-agent)"/>
  <text x="686" y="450" font-size="11" fill="#2f5d50" text-anchor="middle">applied in the gate &#8212; so it stops asking</text>

  <!-- executor -> tools -->
  <line x1="167" y1="440" x2="167" y2="510" stroke="#5f6e6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="421" y1="440" x2="421" y2="510" stroke="#5f6e6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="675" y1="440" x2="675" y2="510" stroke="#5f6e6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 300 440 L 300 478 L 167 478" fill="none" stroke="#5f6e6b" stroke-width="1.5"/>

  <!-- tools -> runtime -->
  <line x1="168" y1="574" x2="168" y2="646" stroke="#5f6e6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 421 574 L 421 604 L 424 604 L 424 646" fill="none" stroke="#5f6e6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 675 574 L 675 604 L 680 604 L 680 646" fill="none" stroke="#5f6e6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 940 574 L 940 604 L 944 604 L 944 646" fill="none" stroke="#5f6e6b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- legend -->
  <line x1="48" y1="742" x2="1072" y2="742" stroke="#cbd3d1"/>
  <line x1="48" y1="762" x2="80" y2="762" stroke="#b4231f" stroke-width="2"/>
  <text x="88" y="766" font-size="11" fill="#5f6e6b">the human gate &#8212; nothing irreversible crosses it unattended</text>
  <line x1="470" y1="762" x2="502" y2="762" stroke="#2f5d50" stroke-width="2"/>
  <text x="510" y="766" font-size="11" fill="#5f6e6b">the learning loop &#8212; each answer becomes a rule</text>
  <line x1="866" y1="762" x2="898" y2="762" stroke="#5f6e6b" stroke-width="1.5"/>
  <text x="906" y="766" font-size="11" fill="#5f6e6b">ordinary data flow</text>
</svg>
